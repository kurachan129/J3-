[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promotion-intelligence"
version = "1.0.0"
description = "J3 promotion match report parser and analysis engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pymupdf>=1.24,<2",
  "pandas>=2.2,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
promotion-intelligence = "promotion_intelligence.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["promotion_intelligence"]
